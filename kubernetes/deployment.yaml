---
# AutoRadixAI — Kubernetes Deployment Manifests
# Apply: kubectl apply -f kubernetes/

apiVersion: v1
kind: Namespace
metadata:
  name: autoradixai

---
# ============================================================
# ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoradix-config
  namespace: autoradixai
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  GPU_ENABLED: "false"
  MAX_UPLOAD_SIZE_MB: "500"

---
# ============================================================
# Secret (use sealed-secrets or Vault in production)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: autoradix-secrets
  namespace: autoradixai
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_THIS_IN_PRODUCTION"
  DATABASE_URL: "postgresql+asyncpg://autoradix:autoradix@postgres-service:5432/autoradixai"
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/2"

---
# ============================================================
# Backend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoradix-backend
  namespace: autoradixai
  labels:
    app: autoradix-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: autoradix-backend
  template:
    metadata:
      labels:
        app: autoradix-backend
    spec:
      containers:
        - name: backend
          image: autoradixai/backend:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: autoradix-config
            - secretRef:
                name: autoradix-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: outputs
              mountPath: /app/outputs
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: outputs
          persistentVolumeClaim:
            claimName: outputs-pvc

---
# ============================================================
# Backend Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: autoradixai
spec:
  selector:
    app: autoradix-backend
  ports:
    - port: 8000
      targetPort: 8000

---
# ============================================================
# Celery Inference Worker Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoradix-celery-inference
  namespace: autoradixai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autoradix-celery-inference
  template:
    metadata:
      labels:
        app: autoradix-celery-inference
    spec:
      containers:
        - name: celery-inference
          image: autoradixai/backend:1.0.0
          command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "inference", "-c", "2", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: autoradix-config
            - secretRef:
                name: autoradix-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: outputs
              mountPath: /app/outputs
            - name: models
              mountPath: /app/ai-models
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: outputs
          persistentVolumeClaim:
            claimName: outputs-pvc
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc

---
# ============================================================
# Frontend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoradix-frontend
  namespace: autoradixai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autoradix-frontend
  template:
    metadata:
      labels:
        app: autoradix-frontend
    spec:
      containers:
        - name: frontend
          image: autoradixai/frontend:1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.autoradixai.example.com"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: autoradixai
spec:
  selector:
    app: autoradix-frontend
  ports:
    - port: 3000
      targetPort: 3000

---
# ============================================================
# Ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autoradix-ingress
  namespace: autoradixai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - autoradixai.example.com
        - api.autoradixai.example.com
      secretName: autoradix-tls
  rules:
    - host: autoradixai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: api.autoradixai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000

---
# ============================================================
# Persistent Volume Claims
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: autoradixai
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outputs-pvc
  namespace: autoradixai
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: autoradixai
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi

---
# ============================================================
# HorizontalPodAutoscaler
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: autoradixai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autoradix-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
