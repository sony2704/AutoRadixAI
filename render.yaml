# render.yaml — One-click deploy to Render (free tier)
# https://render.com/docs/blueprint-spec
#
# HOW TO USE:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" → connect your repo
#   4. Render auto-creates all services below for FREE

services:
  # ── FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: autoradixai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                       # Free tier — sleeps after 15 min idle
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoradixai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: autoradixai-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure secret
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: '["https://autoradixai.vercel.app"]'
      - key: GPU_ENABLED
        value: "false"
      - key: USE_S3
        value: "false"

  # ── Celery Worker ────────────────────────────────────────────────
  - type: worker
    name: autoradixai-celery
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: celery -A app.workers.celery_app worker -Q inference,processing,reporting -c 2 --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoradixai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: autoradixai-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: autoradixai-api
          type: web
          envVarKey: SECRET_KEY

  # ── Redis ────────────────────────────────────────────────────────
  - type: redis
    name: autoradixai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # internal Render services only — no external access

# ── PostgreSQL ────────────────────────────────────────────────────
databases:
  - name: autoradixai-db
    plan: free                       # 1 GB storage, 97 compute hours/month
    databaseName: autoradixai
    user: autoradix
